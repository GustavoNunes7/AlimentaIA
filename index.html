<!DOCTYPE html>
<html lang="pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALIMENTAIA • Modo Vencedor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #0a0a0a, #1a2a1f);
            color: white;
            font-family: sans-serif;
        }

        .glass {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(34, 197, 94, 0.3);
            padding: 2rem;
            border-radius: 2rem;
        }

        .neon {
            text-shadow: 0 0 25px #22c55e;
        }

        button:hover {
            transform: scale(1.05);
            transition: 0.3s;
        }
    </style>
</head>

<body>
    <div class="max-w-3xl mx-auto mt-10">

        <!-- LOGIN -->
        <div id="loginScreen" class="glass text-center">
            <h1 class="text-5xl neon mb-4">🌱 ALIMENTAIA</h1>
            <input id="user" value="gestor" class="w-full p-3 mb-3 rounded-xl bg-black/50" placeholder="Usuário">
            <input id="pass" type="password" value="escola123" class="w-full p-3 mb-6 rounded-xl bg-black/50"
                placeholder="Senha">
            <button onclick="login()" class="w-full py-3 bg-green-500 rounded-xl font-bold">Entrar</button>
        </div>

        <!-- DASHBOARD -->
        <div id="mainScreen" class="glass hidden mt-6">
            <h2 class="text-3xl neon mb-4">🔮 Previsão IA</h2>
            <input id="temp" type="number" class="w-full p-3 mb-3 rounded-xl bg-black/50"
                placeholder="Temperatura (°C)">
            <input id="alunos" type="number" class="w-full p-3 mb-3 rounded-xl bg-black/50"
                placeholder="Número de Alunos" value="180">
            <input id="aceite" type="number" step="0.1" class="w-full p-3 mb-3 rounded-xl bg-black/50"
                placeholder="Aceitação (0-10)" value="8.2">
            <button onclick="prever()"
                class="w-full py-3 bg-gradient-to-r from-green-500 to-emerald-500 font-bold rounded-xl">Consultar
                IA</button>

            <div id="resultado" class="mt-6 hidden"></div>
        </div>
    </div>

    <script>
        function login() {
            const user = document.getElementById('user').value;
            const pass = document.getElementById('pass').value;
            fetch('http://127.0.0.1:8000/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ usuario: user, senha: pass })
            })
                .then(r => r.ok ? r.json() : Promise.reject())
                .then(() => { document.getElementById('loginScreen').classList.add('hidden'); document.getElementById('mainScreen').classList.remove('hidden'); })
                .catch(() => alert("Login inválido! Use gestor / escola123"));
        }

        // Preencher temperatura automaticamente
        function pegarTemperatura() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(pos => {
                    const temp = 20 + (pos.coords.latitude % 10); // Simulação
                    document.getElementById('temp').value = temp.toFixed(1);
                });
            } else {
                document.getElementById('temp').value = 25;
            }
        }
        pegarTemperatura();

        async function prever() {
            const data = {
                temperatura: +document.getElementById('temp').value,
                num_alunos: +document.getElementById('alunos').value,
                aceitacao: +document.getElementById('aceite').value,
                dia_semana: new Date().getDay(),
                horario: new Date().getHours()
            };
            const res = await fetch('http://127.0.0.1:8000/prever', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });
            const r = await res.json();
            const div = document.getElementById('resultado');
            div.classList.remove('hidden');
            div.innerHTML = `<p class="text-4xl font-bold text-green-400">${r.desperdicio} kg</p>
                 <p class="mt-2">${r.alerta}</p>
                 <p>${r.sugestao}</p>
                 <p>Economia: ${r.economia}</p>
                 <p>Horário: ${r.horario}h</p>`;
        }
    </script>
</body>

</html>
